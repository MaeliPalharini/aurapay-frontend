<div class="app-shell">
  <aside class="sidebar">
    <div class="brand">
      <img src="/images/logo.png" alt="Logo AuraPay" class="brand-logo" />
    </div>

    <nav class="sidebar-nav">
      <a routerLink="/customers/new" routerLinkActive="active">Início</a>
      <a routerLink="/wallet" routerLinkActive="active">Minha carteira</a>
      <a routerLink="/cofrinhos" routerLinkActive="active">Cofrinho</a>
      <a routerLink="/pix" routerLinkActive="active">Área Pix</a>
<!--      <a routerLink="/pix" routerLinkActive="active">Cartões</a>-->
    </nav>

    <button
      *ngIf="isCustomerRegistered"
      type="button"
      class="logout-btn"
      (click)="logout()"
    >
      Sair
    </button>
  </aside>

  <main class="content">
    <router-outlet></router-outlet>
  </main>
</div>
